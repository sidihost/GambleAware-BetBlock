      <stop offset="100%" stop-color="#FF3D9A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Obsidian Squircle Tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#ga-obs-bg)" />
  <rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="url(#ga-rim)" stroke-width="4" />

  <!-- Ambient Core Aura & Precision Hairline Ring -->
  <circle cx="256" cy="256" r="190" fill="url(#ga-core-glow)" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#FF3D9A" stroke-opacity="0.18" stroke-width="3" />

  <!-- Outer Pearl-White Architectural Shield -->
  <path
    d="M 256 105 L 387 150 L 387 251 C 387 335 326 387 256 412 C 186 387 125 335 125 251 L 125 150 Z"
