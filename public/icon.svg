      <stop offset="68%" stop-color="#FBF3F7" />
      <stop offset="100%" stop-color="#E7CFD9" />
    </linearGradient>
    <linearGradient id="ga-pink-core" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF8CC8" />
      <stop offset="48%" stop-color="#FF3D9A" />
      <stop offset="100%" stop-color="#D11372" />
    </linearGradient>
    <radialGradient id="ga-core-glow" cx="50%" cy="48%" r="46%">
