<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ga-obs-bg" cx="32%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#2D091D" />
      <stop offset="48%" stop-color="#0D080C" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="ga-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF72B8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FF3D9A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="ga-pearl-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FBF2F7" />
      <stop offset="100%" stop-color="#E7CFD9" />
    </linearGradient>
    <linearGradient id="ga-pearl-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D3DE" />
      <stop offset="100%" stop-color="#C8AAB9" />
    </linearGradient>
    <linearGradient id="ga-neon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9AD0" />
      <stop offset="50%" stop-color="#FF3D9A" />
      <stop offset="100%" stop-color="#E01878" />
    </linearGradient>
    <linearGradient id="ga-neon-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E81E80" />
      <stop offset="100%" stop-color="#9A094F" />
    </linearGradient>
    <radialGradient id="ga-core-glow" cx="55%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#FF3D9A" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF3D9A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Obsidian Squircle Tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#ga-obs-bg)" />
  <rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="url(#ga-rim)" stroke-width="4" />

  <!-- Subtle Radiant Glow Behind Emblem -->
  <circle cx="272" cy="264" r="188" fill="url(#ga-core-glow)" />

  <!-- Architectural Faceted "G" Monolith (Pearl-White Main Body) -->
  <path
    d="M 352 132 L 320 166 L 194 166 L 166 194 L 166 318 L 194 346 L 318 346 L 348 378 L 322 396 L 174 396 L 116 338 L 116 174 L 174 116 L 326 116 Z"
    fill="url(#ga-pearl-top)"
  />

  <!-- Inner Chamfer Shadow Facet for Architectural 3D Depth -->
  <path
    d="M 166 318 L 194 346 L 318 346 L 348 378 L 322 396 L 174 396 L 142 364 L 166 318 Z"
    fill="url(#ga-pearl-shadow)"
    opacity="0.55"
  />

  <!-- Electric Pink Vault Keystone Bolt (Sealing the Lower Right Portal) -->
  <path
    d="M 244 232 L 396 232 L 396 334 L 346 382 L 346 280 L 218 280 Z"
    fill="url(#ga-neon-top)"
  />
  <!-- Deep Pink Bevel Facet on Vertical Bolt Pillar -->
  <path
    d="M 346 280 L 396 232 L 396 334 L 346 382 Z"
    fill="url(#ga-neon-deep)"
  />

  <!-- Upper-Right North-Star Beacon Cutout -->
  <path
    d="M 370 122 Q 370 158 406 158 Q 370 158 370 194 Q 370 158 334 158 Q 370 158 370 122 Z"
    fill="#FF72B8"
  />
  <circle cx="370" cy="158" r="7" fill="#FFFFFF" />
