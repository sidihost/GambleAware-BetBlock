      <stop offset="0%" stop-color="#29091B" />
      <stop offset="52%" stop-color="#0D080C" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <linearGradient id="ga-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7BC0" stop-opacity="0.58" />
      <stop offset="52%" stop-color="#FF3D9A" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14" />
    </linearGradient>
    <linearGradient id="ga-pearl" x1="0%" y1="0%" x2="100%" y2="100%">
