name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore or create persistent release keystore
      id: keystore
      uses: actions/cache@v4
      with:
        path: ci-release.jks
        key: gambleaware-ci-release-keystore-v1

    - name: Provision release signing keystore
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > ci-release.jks
          echo "Using production UPLOAD_KEYSTORE_BASE64 secret."
        elif [ ! -f ci-release.jks ]; then
          keytool -genkeypair -v -keystore ci-release.jks \
            -storepass "${STORE_PASSWORD:-gambleaware_ci_release_store}" \
            -alias upload \
            -keypass "${KEY_PASSWORD:-gambleaware_ci_release_store}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GambleAware,O=Imoogle Technology,C=NG"
          echo "Generated persistent CI release keystore (cached across runs)."
        else
          echo "Using cached CI release keystore."
        fi

        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Run unit tests and build signed Release APK
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'gambleaware_ci_release_store' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'gambleaware_ci_release_store' }}
      run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

    - name: Verify APK signature and package GambleAware-Nigeria.apk
      run: |
        mkdir -p apk-output
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1 || true)"
        if [ -n "$APKSIGNER" ]; then
          "$APKSIGNER" verify --verbose "$APK_PATH"
        fi
        cp "$APK_PATH" apk-output/GambleAware-Nigeria.apk

    - name: Upload GambleAware APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: gambleaware-android-apk
        path: apk-output/GambleAware-Nigeria.apk

    - name: Publish Latest APK Release
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: GambleAware Android (Latest Build)
        body: Automated signed release APK build for commit `${{ github.sha }}`.
        make_latest: "true"
        overwrite_files: true
        files: apk-output/GambleAware-Nigeria.apk
