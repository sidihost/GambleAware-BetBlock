name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure debug.keystore exists for CI
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Run unit tests and build APK
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

    - name: Package GambleAware-Nigeria.apk
      run: |
        mkdir -p apk-output
        cp app/build/outputs/apk/debug/app-debug.apk apk-output/GambleAware-Nigeria.apk

    - name: Upload GambleAware APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: gambleaware-android-apk
        path: apk-output/GambleAware-Nigeria.apk

    - name: Publish Latest APK Release
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: GambleAware Android (Latest Build)
        body: Automated Android APK build for commit `${{ github.sha }}`.
        make_latest: "true"
        overwrite_files: true
        files: apk-output/GambleAware-Nigeria.apk
